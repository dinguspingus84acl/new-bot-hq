<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>New Bot HQ — Live Office</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Sora:wght@500;600;700&display=swap" rel="stylesheet" />
<style>
:root {
  --bg: #070910;
  --ink: #eef3ff;
  --muted: #9aa8c7;
  --line: rgba(148, 163, 184, 0.22);
  --glass: rgba(10, 16, 32, 0.62);
  --glass-2: rgba(15, 23, 42, 0.72);
  --good: #4ade80;
  --work: #7dd3fc;
  --shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  min-height: 100vh;
  color: var(--ink);
  background:
    radial-gradient(1200px 500px at 12% -10%, #1e1b4b55, transparent 55%),
    radial-gradient(900px 420px at 100% 0%, #14532d33, transparent 50%),
    var(--bg);
  font-family: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
}
h1, h2, .name, .brand {
  font-family: Sora, "Segoe UI", system-ui, sans-serif;
}
.wrap {
  width: min(1240px, calc(100% - 28px));
  margin: 0 auto;
  padding: 18px 0 28px;
}
header.top {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  gap: 16px;
  flex-wrap: wrap;
  margin-bottom: 14px;
}
.badge {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 4px 10px;
  border-radius: 999px;
  font-size: 0.72rem;
  font-weight: 700;
  letter-spacing: 0.04em;
  background: #14532d66;
  color: var(--good);
  border: 1px solid #22c55e55;
}
.badge::before {
  content: "";
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--good);
  box-shadow: 0 0 10px #4ade80;
  animation: pulse 1.6s ease-in-out infinite;
}
header.top h1 {
  margin: 6px 0 2px;
  font-size: 1.55rem;
  letter-spacing: -0.02em;
}
.meta { color: var(--muted); font-size: 0.9rem; }
.live {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 12px;
  border-radius: 12px;
  background: var(--glass);
  border: 1px solid var(--line);
  backdrop-filter: blur(12px);
  color: var(--muted);
  font-size: 0.82rem;
}
.stage-wrap {
  position: relative;
  border-radius: 22px;
  overflow: hidden;
  border: 1px solid var(--line);
  box-shadow: var(--shadow);
  aspect-ratio: 16 / 9;
  max-height: min(74vh, 820px);
  background: #05070f;
}
.floor-bg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center;
  image-rendering: auto;
}
.vignette {
  position: absolute;
  inset: 0;
  pointer-events: none;
  background:
    linear-gradient(180deg, rgba(5, 8, 16, 0.18), transparent 18%, transparent 78%, rgba(5, 8, 16, 0.38)),
    radial-gradient(ellipse at 50% 70%, transparent 42%, rgba(5, 8, 16, 0.45) 100%);
}
.actors { position: absolute; inset: 0; }
.actor {
  position: absolute;
  transform: translate(-50%, -100%);
  z-index: 3;
  filter: drop-shadow(0 10px 8px rgba(0, 0, 0, 0.55));
  transition: left 2.7s linear, top 2.7s linear;
}
.runner { width: 76px; height: 104px; }
.critter { width: 68px; height: 68px; z-index: 4; transition-duration: 3.1s; transition-timing-function: ease-in-out; }
.actor img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
  user-select: none;
  pointer-events: none;
}
.actor.face-left img { transform: scaleX(-1); }
.runner.working img { animation: walk-bob 0.36s ease-in-out infinite; }
.runner.idle img { animation: breathe 2.5s ease-in-out infinite; }
.runner.done { animation: cheer 0.72s ease-in-out infinite; }
.critter.working { animation: hop 0.55s ease-in-out infinite; }
.critter.idle { animation: breathe 2.6s ease-in-out infinite; }
.critter.done { animation: cheer 0.8s ease-in-out infinite; }
.label {
  position: absolute;
  left: 50%;
  top: calc(100% + 2px);
  transform: translateX(-50%);
  white-space: nowrap;
  font-size: 10px;
  font-weight: 700;
  padding: 2px 7px;
  border-radius: 999px;
  background: rgba(8, 12, 24, 0.78);
  border: 1px solid rgba(255, 255, 255, 0.12);
  backdrop-filter: blur(8px);
}
.speech {
  position: absolute;
  left: 50%;
  bottom: calc(100% + 8px);
  transform: translateX(-50%);
  min-width: 92px;
  max-width: 170px;
  padding: 7px 9px;
  border-radius: 12px;
  background: #f8fafc;
  color: #0f172a;
  font-size: 11px;
  font-weight: 600;
  line-height: 1.35;
  box-shadow: 0 8px 20px rgba(0, 0, 0, 0.35);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s ease;
  z-index: 6;
}
.speech.show { opacity: 1; }
.speech::after {
  content: "";
  position: absolute;
  left: 50%;
  bottom: -6px;
  transform: translateX(-50%);
  border: 6px solid transparent;
  border-top-color: #f8fafc;
  border-bottom: 0;
}
.sparkle {
  display: none;
  position: absolute;
  top: -8px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 14px;
}
.actor.done .sparkle { display: block; animation: twinkle 0.8s ease-in-out infinite; }
.ticker {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 12px 0 16px;
  padding: 12px 16px;
  border-radius: 14px;
  background: var(--glass-2);
  border: 1px solid var(--line);
  backdrop-filter: blur(14px);
  color: var(--muted);
  font-size: 0.92rem;
}
.ticker b { color: var(--ink); }
.roster {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 12px;
}
.card {
  display: flex;
  gap: 12px;
  align-items: flex-start;
  padding: 14px;
  border-radius: 16px;
  background: linear-gradient(180deg, rgba(30, 41, 59, 0.72), rgba(15, 23, 42, 0.78));
  border: 1px solid var(--line);
  box-shadow: 0 10px 28px rgba(0, 0, 0, 0.22);
  backdrop-filter: blur(16px);
}
.card img {
  width: 56px;
  height: 56px;
  object-fit: contain;
  flex: 0 0 auto;
  filter: drop-shadow(0 6px 6px rgba(0, 0, 0, 0.35));
}
.card .name { font-weight: 700; font-size: 0.95rem; }
.card .role { color: var(--muted); font-size: 0.75rem; margin-top: 1px; }
.card .task { font-size: 0.84rem; margin-top: 8px; line-height: 1.35; }
.card .stage { color: var(--muted); font-size: 0.78rem; margin-top: 4px; min-height: 2.2em; }
.pill {
  margin-left: auto;
  font-size: 0.64rem;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  padding: 3px 7px;
  border-radius: 999px;
  flex: 0 0 auto;
}
.pill-working { background: #1d4ed855; color: #93c5fd; }
.pill-idle { background: #33415588; color: #cbd5e1; }
.pill-done { background: #14532d88; color: #86efac; }
.pill-blocked { background: #7c2d1288; color: #fdba74; }
.bar {
  height: 6px;
  background: #0b1220;
  border-radius: 99px;
  margin-top: 8px;
  overflow: hidden;
  border: 1px solid #334155;
}
.bar > i {
  display: block;
  height: 100%;
  background: linear-gradient(90deg, #38bdf8, #a78bfa);
}
footer {
  margin-top: 18px;
  color: #64748b;
  font-size: 0.75rem;
  line-height: 1.5;
}
@keyframes pulse { 50% { opacity: 0.35; } }
@keyframes walk-bob {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-5px); }
}
.face-left.working img { animation-name: walk-bob-flip; }
@keyframes walk-bob-flip {
  0%, 100% { transform: scaleX(-1) translateY(0); }
  50% { transform: scaleX(-1) translateY(-5px); }
}
@keyframes breathe {
  0%, 100% { transform: translateY(0) scale(1); }
  50% { transform: translateY(-2px) scale(1.03); }
}
.face-left.idle img { animation-name: breathe-flip; }
@keyframes breathe-flip {
  0%, 100% { transform: scaleX(-1) translateY(0) scale(1); }
  50% { transform: scaleX(-1) translateY(-2px) scale(1.03); }
}
@keyframes hop {
  0%, 100% { transform: translate(-50%, -100%) translateY(0) rotate(-2deg); }
  50% { transform: translate(-50%, -100%) translateY(-11px) rotate(3deg); }
}
@keyframes cheer {
  0%, 100% { transform: translate(-50%, -100%) rotate(-7deg); }
  50% { transform: translate(-50%, -100%) translateY(-10px) rotate(7deg); }
}
@keyframes twinkle { 50% { opacity: 0.2; transform: translateX(-50%) translateY(-4px); } }
@media (max-width: 720px) {
  .runner { width: 58px; height: 80px; }
  .critter { width: 50px; height: 50px; }
  header.top h1 { font-size: 1.25rem; }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <div class="badge">PAPER RESEARCH ONLY</div>
      <h1>New Bot HQ</h1>
      <div class="meta">Indie office floor · original critters · live from <code>status.json</code></div>
    </div>
    <div class="live">Floor feed · <span id="updated">…</span></div>
  </header>

  <div class="stage-wrap">
    <img class="floor-bg" src="assets/office-floor.jpg" alt="Pixel art HQ office floor" />
    <div class="vignette"></div>
    <div class="actors" id="actors"></div>
  </div>

  <div class="ticker" id="ticker"><b>Floor</b> Loading office chatter…</div>
  <div class="roster" id="roster"></div>
  <footer>
    Original HQ mascots: Voltbug, Foldfox, Scanslime, Archivowl, Bunbot — originals only, not affiliated with Pokémon.
    Auto-refreshes every 3s. No trades.
  </footer>
</div>
<script>
const CREATURES = {
  voltbug:   { file: "assets/creatures/voltbug.png",   name: "Voltbug",   species: "spark beetle" },
  foldfox:   { file: "assets/creatures/foldfox.png",   name: "Foldfox",   species: "origami fox" },
  scanslime: { file: "assets/creatures/scanslime.png", name: "Scanslime", species: "lens slime" },
  archivowl: { file: "assets/creatures/archivowl.png", name: "Archivowl", species: "archive owl" },
  bunbot:    { file: "assets/creatures/bunbot.png",    name: "Bunbot",    species: "bunny-bot" }
};
const RUNNERS = {
  deep: "assets/runners/mira.png",
  cluster: "assets/runners/kai.png",
  watch: "assets/runners/oak.png",
  lab: "assets/runners/rex.png",
  coord: "assets/runners/newbot.png"
};
const DEFAULT_CREATURE = {
  deep: "scanslime",
  cluster: "foldfox",
  watch: "voltbug",
  lab: "archivowl",
  coord: "bunbot"
};
const FALLBACK_IDS = ["mira", "kai", "oak", "rex", "newbot"];
const DESKS = [
  { x: 27.6, y: 59.8, face: "right", cx: 7.2, cy: 2.2 },
  { x: 39.8, y: 35.2, face: "right", cx: 6.2, cy: 2.0 },
  { x: 55.4, y: 33.6, face: "left",  cx: 6.0, cy: 1.6 },
  { x: 71.2, y: 33.8, face: "left",  cx: -6.6, cy: 2.4 },
  { x: 63.0, y: 57.6, face: "left",  cx: 7.4, cy: 3.0 }
];
const PATHS = [
  [{x:43,y:48},{x:49,y:63},{x:46,y:52},{x:50,y:68}],
  [{x:40,y:58},{x:48,y:50},{x:44,y:66},{x:51,y:56}],
  [{x:46,y:47},{x:42,y:62},{x:50,y:54},{x:45,y:70}]
];
const pathIndex = {};

function crewFor(station, idx) {
  const cid = station.creature_id || DEFAULT_CREATURE[station.id] || Object.keys(CREATURES)[idx % 5];
  const creature = CREATURES[cid] || CREATURES.bunbot;
  const runner = RUNNERS[station.id] || ("assets/runners/" + (FALLBACK_IDS[idx % FALLBACK_IDS.length]) + ".png");
  return {
    runner: runner,
    creature: creature.file,
    creatureName: station.creature || creature.name,
    species: station.creature_species || creature.species
  };
}
function deskFor(station, idx) {
  const n = Number.isFinite(station.desk) ? station.desk : idx;
  return DESKS[((n % DESKS.length) + DESKS.length) % DESKS.length];
}
function setPos(el, x, y) {
  el.style.left = x + "%";
  el.style.top = y + "%";
}
function faceToward(el, fromX, toX, fallback) {
  const dir = toX === fromX ? fallback : (toX < fromX ? "left" : "right");
  el.classList.toggle("face-left", dir === "left");
}
function makeRunner(station, idx) {
  const crew = crewFor(station, idx);
  const desk = deskFor(station, idx);
  const el = document.createElement("div");
  el.className = "actor runner " + (station.state || "idle");
  el.dataset.id = station.id;
  el.innerHTML =
    '<span class="sparkle">✨</span>' +
    '<img alt="' + (station.character || "Agent") + '" src="' + crew.runner + '" />' +
    '<div class="label">' + (station.character || "Agent") + '</div>' +
    '<div class="speech" id="speech-' + station.id + '"></div>';
  faceToward(el, desk.x, desk.x + (desk.face === "left" ? -1 : 1), desk.face);
  setPos(el, desk.x, desk.y);
  return el;
}
function makeCritter(station, idx) {
  const crew = crewFor(station, idx);
  const desk = deskFor(station, idx);
  const el = document.createElement("div");
  el.className = "actor critter " + (station.state || "idle");
  el.dataset.id = "c-" + station.id;
  el.innerHTML = '<img alt="' + crew.creatureName + '" src="' + crew.creature + '" />';
  setPos(el, desk.x + desk.cx, desk.y + desk.cy);
  return el;
}
function wander(el, pathIdx, followEl) {
  if (followEl) {
    const x = parseFloat(followEl.style.left) + 6.0;
    const y = parseFloat(followEl.style.top) + 1.4;
    const fromX = parseFloat(el.style.left);
    faceToward(el, fromX, x, "right");
    setPos(el, x, y);
    return;
  }
  const path = PATHS[pathIdx % PATHS.length];
  const i = pathIndex[el.dataset.id] = ((pathIndex[el.dataset.id] || 0) + 1) % path.length;
  const next = path[i];
  const fromX = parseFloat(el.style.left) || next.x;
  faceToward(el, fromX, next.x, "right");
  setPos(el, next.x, next.y);
}
function park(el, station, idx, kind) {
  const desk = deskFor(station, idx);
  if (kind === "critter") setPos(el, desk.x + desk.cx, desk.y + desk.cy);
  else {
    setPos(el, desk.x, desk.y);
    faceToward(el, desk.x, desk.x + (desk.face === "left" ? -1 : 1), desk.face);
  }
}
function renderRoster(stations) {
  const roster = document.getElementById("roster");
  roster.innerHTML = "";
  stations.forEach((s, idx) => {
    const crew = crewFor(s, idx);
    const pct = Math.round(100 * (s.progress || 0));
    const card = document.createElement("article");
    card.className = "card";
    card.innerHTML =
      '<img src="' + crew.creature + '" alt="' + crew.creatureName + '" />' +
      '<div style="flex:1;min-width:0">' +
        '<div style="display:flex;gap:8px;align-items:flex-start">' +
          '<div>' +
            '<div class="name">' + (s.character || "Agent") + ' <span style="opacity:.65;font-size:.78rem">+ ' + crew.creatureName + '</span></div>' +
            '<div class="role">' + (s.role || "") + " · " + crew.species + "</div>" +
          "</div>" +
          '<div class="pill pill-' + (s.state || "idle") + '">' + (s.state || "idle") + "</div>" +
        "</div>" +
        '<div class="task">' + (s.task || "") + "</div>" +
        '<div class="stage">' + (s.stage || "") + "</div>" +
        '<div class="bar"><i style="width:' + pct + "%;background:linear-gradient(90deg," + (s.color || "#38bdf8") + ",#a78bfa)" + '"></i></div>' +
      "</div>";
    roster.appendChild(card);
  });
}
function syncActors(stations) {
  stations.forEach((s, i) => {
    const r = document.querySelector('.runner[data-id="' + s.id + '"]');
    const c = document.querySelector('.critter[data-id="c-' + s.id + '"]');
    if (r) {
      r.classList.remove("working", "idle", "done", "blocked");
      r.classList.add(s.state || "idle");
      if ((s.state || "idle") !== "working") park(r, s, i, "runner");
    }
    if (c) {
      c.classList.remove("working", "idle", "done", "blocked");
      c.classList.add(s.state || "idle");
      if ((s.state || "idle") !== "working") park(c, s, i, "critter");
    }
  });
}
async function load() {
  try {
    const data = await (await fetch("status.json?ts=" + Date.now())).json();
    document.getElementById("updated").textContent = "updated " + (data.updated_at_utc || "?");
    const stations = (data.stations || []).slice().sort((a, b) => (a.desk ?? 9) - (b.desk ?? 9));
    window.__stations = stations;
    renderRoster(stations);
    const actors = document.getElementById("actors");
    if (!actors.dataset.ready) {
      stations.forEach((s, i) => {
        actors.appendChild(makeRunner(s, i));
        actors.appendChild(makeCritter(s, i));
      });
      actors.dataset.ready = "1";
      setInterval(() => {
        (window.__stations || []).forEach((s, i) => {
          const r = document.querySelector('.runner[data-id="' + s.id + '"]');
          const c = document.querySelector('.critter[data-id="c-' + s.id + '"]');
          if (r && r.classList.contains("working")) wander(r, i);
          if (c && c.classList.contains("working")) wander(c, i + 1, r);
        });
      }, 2800);
      setInterval(() => {
        const working = (window.__stations || []).filter((s) => s.state === "working");
        if (!working.length) return;
        const s = working[Math.floor(Math.random() * working.length)];
        const bubble = document.getElementById("speech-" + s.id);
        if (!bubble) return;
        bubble.textContent = (s.stage || s.task || "").slice(0, 70);
        bubble.classList.add("show");
        setTimeout(() => bubble.classList.remove("show"), 2300);
      }, 4000);
    } else {
      syncActors(stations);
    }
    const lines = data.ticker || [];
    if (lines.length) {
      const i = Math.floor(Date.now() / 4000) % lines.length;
      document.getElementById("ticker").innerHTML = "<b>Floor</b> " + lines[i];
    }
  } catch (e) {
    document.getElementById("ticker").textContent = "Could not load status.json";
  }
}
load();
setInterval(load, 3000);
</script>
</body>
</html>
