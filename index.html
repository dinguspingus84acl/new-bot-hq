<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>New Bot HQ — Live Office</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Sora:wght@500;600;700&display=swap" rel="stylesheet" />
<style>
:root {
  --bg: #070910;
  --ink: #eef3ff;
  --muted: #9aa8c7;
  --line: rgba(148, 163, 184, 0.22);
  --glass: rgba(10, 16, 32, 0.62);
  --glass-2: rgba(15, 23, 42, 0.72);
  --good: #4ade80;
  --work: #7dd3fc;
  --shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  min-height: 100vh;
  color: var(--ink);
  background:
    radial-gradient(1200px 500px at 12% -10%, #1e1b4b55, transparent 55%),
    radial-gradient(900px 420px at 100% 0%, #14532d33, transparent 50%),
    var(--bg);
  font-family: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
}
h1, h2, .name, .brand {
  font-family: Sora, "Segoe UI", system-ui, sans-serif;
}
.wrap {
  width: min(1240px, calc(100% - 28px));
  margin: 0 auto;
  padding: 18px 0 28px;
}
header.top {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  gap: 16px;
  flex-wrap: wrap;
  margin-bottom: 14px;
}
.badge {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 4px 10px;
  border-radius: 999px;
  font-size: 0.72rem;
  font-weight: 700;
  letter-spacing: 0.04em;
  background: #14532d66;
  color: var(--good);
  border: 1px solid #22c55e55;
}
.badge::before {
  content: "";
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--good);
  box-shadow: 0 0 10px #4ade80;
  animation: pulse 1.6s ease-in-out infinite;
}
header.top h1 {
  margin: 6px 0 2px;
  font-size: 1.55rem;
  letter-spacing: -0.02em;
}
.meta { color: var(--muted); font-size: 0.9rem; }
.live {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 12px;
  border-radius: 12px;
  background: var(--glass);
  border: 1px solid var(--line);
  backdrop-filter: blur(12px);
  color: var(--muted);
  font-size: 0.82rem;
}
.stage-wrap {
  position: relative;
  border-radius: 22px;
  overflow: hidden;
  border: 1px solid var(--line);
  box-shadow: var(--shadow);
  aspect-ratio: 16 / 9;
  max-height: min(74vh, 820px);
  background: #05070f;
}
.floor-bg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center;
  image-rendering: auto;
}
.vignette {
  position: absolute;
  inset: 0;
  pointer-events: none;
  background:
    linear-gradient(180deg, rgba(5, 8, 16, 0.18), transparent 18%, transparent 78%, rgba(5, 8, 16, 0.38)),
    radial-gradient(ellipse at 50% 70%, transparent 42%, rgba(5, 8, 16, 0.45) 100%);
}
.ambient, .vignette, .scene { position: absolute; inset: 0; }
.scene { pointer-events: none; z-index: 3; }
.ambient { pointer-events: none; z-index: 1; }
.vignette { z-index: 2; }
.led {
  position: absolute;
  width: 7px;
  height: 3px;
  margin: -1px 0 0 -3px;
  border-radius: 1px;
  background: #67e8f9;
  opacity: 0;
  box-shadow: 0 0 6px #22d3ee66;
}
.led.on { opacity: 0.28; }
.dust {
  position: absolute;
  inset: 18% 22% 28% 22%;
  background-image:
    radial-gradient(circle, rgba(186, 230, 253, 0.14) 1px, transparent 1px);
  background-size: 120px 90px;
  opacity: 0.12;
  animation: dust-drift 14s linear infinite;
}
.ambient.paused .led, .ambient.paused .dust { animation: none; opacity: 0; }
.actor {
  position: absolute;
  left: 0;
  top: 0;
  transform: translate3d(0,0,0) translate(-50%,-100%);
  will-change: transform;
  pointer-events: none;
}
.runner { width: 86px; height: 118px; }
.critter { width: 58px; height: 58px; }
.shadow {
  position: absolute;
  left: 50%;
  bottom: 1px;
  width: 38%;
  height: 8px;
  transform: translateX(-50%);
  background: radial-gradient(ellipse, rgba(0,0,0,.5), transparent 70%);
  pointer-events: none;
}
.sprite-wrap {
  position: absolute;
  inset: 0 0 10px 0;
  transform-origin: 50% 80%;
}
.actor img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
  object-position: bottom center;
  user-select: none;
  pointer-events: none;
  image-rendering: pixelated;
  image-rendering: crisp-edges;
}
.label {
  position: absolute;
  left: 50%;
  top: calc(100% + 1px);
  transform: translateX(-50%);
  white-space: nowrap;
  font-size: 10px;
  font-weight: 700;
  padding: 2px 7px;
  border-radius: 999px;
  background: rgba(8, 12, 24, 0.78);
  border: 1px solid rgba(255, 255, 255, 0.12);
  backdrop-filter: blur(8px);
}
.cue {
  position: absolute;
  left: 50%;
  bottom: 2px;
  width: 12px;
  height: 5px;
  transform: translate(-50%, 70%);
  border-radius: 50%;
  opacity: 0;
  pointer-events: none;
}
.actor.cue-work .cue { opacity: 0.55; background: #22d3ee; animation: cue-pulse 2.6s ease-in-out infinite; }
.actor.cue-blocked .cue { opacity: 0.7; background: #fbbf24; }
.actor.flash-done .cue { opacity: 0.9; background: #4ade80; }
.done-spark {
  position: absolute;
  left: 50%;
  top: 8%;
  width: 4px;
  height: 4px;
  margin-left: -2px;
  background: #86efac;
  opacity: 0;
  pointer-events: none;
  box-shadow: 8px -6px 0 #4ade80, -7px -4px 0 #bbf7d0;
}
.done-spark.play { animation: spark-once 0.5s ease-out forwards; }
.speech {
  position: absolute;
  left: 0;
  top: 0;
  min-width: 72px;
  max-width: 148px;
  padding: 6px 8px;
  border-radius: 10px;
  background: #f8fafc;
  color: #0f172a;
  font-size: 11px;
  font-weight: 600;
  line-height: 1.3;
  box-shadow: 0 8px 20px rgba(0, 0, 0, 0.35);
  opacity: 0;
  pointer-events: none;
  transform: translate3d(0,0,0) translate(-50%,-100%) scale(0.88);
  transition: opacity 180ms ease;
}
.speech.show { opacity: 1; }
.speech-text { display: flex; flex-direction: column; gap: 1px; }
.speech-text.crossfade { opacity: 0.35; }
.speech::after {
  content: "";
  position: absolute;
  left: 50%;
  bottom: -5px;
  transform: translateX(-50%) rotate(var(--tail, 0deg));
  border: 5px solid transparent;
  border-top-color: #f8fafc;
  border-bottom: 0;
}
.occluder {
  position: absolute;
  pointer-events: none;
  image-rendering: pixelated;
}
.dest-mark {
  position: absolute;
  width: 7px;
  height: 7px;
  border: 1px solid rgba(125, 211, 252, 0.55);
  opacity: 0;
  pointer-events: none;
  transform: translate(-50%,-50%) rotate(45deg);
  transition: opacity 220ms ease;
}
.dest-mark.show { opacity: 0.7; background: rgba(125, 211, 252, 0.18); }
.nav-debug { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 3; }
.critter.fx-twitch img { animation: fx-twitch 0.4s steps(2, end); }
.critter.fx-hover img { animation: fx-hover 0.45s ease-in-out; }
.critter.fx-flick img { animation: fx-flick 0.38s steps(2, end); }
.critter.fx-spark img { animation: fx-spark 0.36s ease-out; }
.critter.fx-blink img { animation: fx-blink 0.28s steps(2, end); }
.ticker {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 12px 0 16px;
  padding: 12px 16px;
  border-radius: 14px;
  background: var(--glass-2);
  border: 1px solid var(--line);
  backdrop-filter: blur(14px);
  color: var(--muted);
  font-size: 0.92rem;
}
.ticker b { color: var(--ink); }
.roster {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 12px;
}
.card {
  display: flex;
  gap: 12px;
  align-items: flex-start;
  padding: 14px;
  border-radius: 16px;
  background: linear-gradient(180deg, rgba(30, 41, 59, 0.72), rgba(15, 23, 42, 0.78));
  border: 1px solid var(--line);
  box-shadow: 0 10px 28px rgba(0, 0, 0, 0.22);
  backdrop-filter: blur(16px);
}
.card img {
  width: 56px;
  height: 56px;
  object-fit: contain;
  flex: 0 0 auto;
  filter: drop-shadow(0 6px 6px rgba(0, 0, 0, 0.35));
}
.card .name { font-weight: 700; font-size: 0.95rem; }
.card .role { color: var(--muted); font-size: 0.75rem; margin-top: 1px; }
.card .task { font-size: 0.84rem; margin-top: 8px; line-height: 1.35; }
.card .stage { color: var(--muted); font-size: 0.78rem; margin-top: 4px; min-height: 2.2em; }
.pill {
  margin-left: auto;
  font-size: 0.64rem;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  padding: 3px 7px;
  border-radius: 999px;
  flex: 0 0 auto;
}
.pill-working { background: #1d4ed855; color: #93c5fd; }
.pill-idle { background: #33415588; color: #cbd5e1; }
.pill-done { background: #14532d88; color: #86efac; }
.pill-blocked { background: #7c2d1288; color: #fdba74; }
.bar {
  height: 6px;
  background: #0b1220;
  border-radius: 99px;
  margin-top: 8px;
  overflow: hidden;
  border: 1px solid #334155;
}
.bar > i {
  display: block;
  height: 100%;
  background: linear-gradient(90deg, #38bdf8, #a78bfa);
}
footer {
  margin-top: 18px;
  color: #64748b;
  font-size: 0.75rem;
  line-height: 1.5;
}
@keyframes pulse { 50% { opacity: 0.35; } }
@keyframes cue-pulse {
  0%, 100% { opacity: 0.28; }
  50% { opacity: 0.7; }
}
@keyframes spark-once {
  0% { opacity: 0; transform: translateY(2px) scale(0.6); }
  35% { opacity: 1; }
  100% { opacity: 0; transform: translateY(-8px) scale(1); }
}
@keyframes dust-drift {
  0% { transform: translateY(0); }
  100% { transform: translateY(-8px); }
}
@keyframes fx-twitch {
  0%, 100% { transform: rotate(0deg); }
  40% { transform: rotate(-3deg); }
}
@keyframes fx-hover {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-2px); }
}
@keyframes fx-flick {
  0%, 100% { transform: rotate(0deg); }
  50% { transform: rotate(3deg); }
}
@keyframes fx-spark {
  0%, 100% { filter: brightness(1); }
  40% { filter: brightness(1.25); }
}
@keyframes fx-blink {
  0%, 100% { transform: scaleY(1); }
  40% { transform: scaleY(0.88); }
}
@media (max-width: 720px) {
  .runner { width: 66px; height: 90px; }
  .critter { width: 46px; height: 46px; }
  header.top h1 { font-size: 1.25rem; }
}
@media (prefers-reduced-motion: reduce) {
  .led, .dust, .cue, .done-spark, .critter .sprite-wrap { animation: none !important; }
  .badge::before { animation: none; }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <div class="badge">PAPER RESEARCH ONLY</div>
      <h1>New Bot HQ</h1>
      <div class="meta">Indie office floor · original critters · live from <code>status.json</code></div>
    </div>
    <div class="live">Floor feed · <span id="updated">…</span></div>
  </header>

  <div class="stage-wrap" id="stage">
    <img class="floor-bg" src="assets/floor.jpg" alt="Pixel art HQ office floor" />
    <div class="ambient" id="ambient"></div>
    <div class="vignette"></div>
    <div class="scene" id="scene"></div>
  </div>

  <div class="ticker" id="ticker"><b>Floor</b> Loading office chatter…</div>
  <div class="roster" id="roster"></div>
  <footer>
    Original HQ mascots: Voltbug, Foldfox, Scanslime, Archivowl, Bunbot — originals only, not affiliated with Pokémon.
    Auto-refreshes every 3s. No trades.
  </footer>
</div>
<script src="office-nav.js"></script>
<script src="office-sim.js"></script>
</body>
</html>
